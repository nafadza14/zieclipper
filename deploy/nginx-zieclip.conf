# nginx reverse proxy for zieclip in production.
#
# Path: /etc/nginx/sites-available/zieclip  (symlinked from sites-enabled/)
# After edits: sudo nginx -t && sudo systemctl reload nginx
#
# What nginx does for us:
#   1. Terminates HTTPS (certbot manages the cert -- see DEPLOY-VPS.md).
#   2. Reverse-proxies to Node on 127.0.0.1:3000 (PM2 keeps it alive).
#   3. Enforces the 200 MB request body limit that matches
#      /api/upload's server-side cap.
#   4. Adds long client_body/proxy_read timeouts because /api/download and
#      /api/export can legitimately take 5+ minutes to finish.

# --- Redirect all plain HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name clip.zieads.com;

    # Let certbot's HTTP-01 challenge write to /.well-known/acme-challenge/
    # without redirect interference.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clip.zieads.com;

    # certbot fills these in after the first `certbot --nginx` run:
    ssl_certificate     /etc/letsencrypt/live/clip.zieads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clip.zieads.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload cap must match MAX_UPLOAD_BYTES in /api/upload/route.ts and
    # /api/editor/upload-video/route.ts (both 200 MB). If nginx rejects a
    # body first the Node code never sees it, and the user gets a 413 from
    # nginx directly.
    client_max_body_size 220m;

    # Downloads / exports can take a while. Bump these from nginx defaults
    # (60s) so long ffmpeg renders don't get killed by an upstream timeout.
    client_body_timeout   360s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    360s;
    proxy_read_timeout    360s;

    # Serve /_next/static and public assets directly through nginx when
    # possible -- faster than proxying every request.
    location /_next/static/ {
        alias /home/ubuntu/zieclip/current/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
