# nginx reverse proxy for zieclip in production.
#
# Path: /etc/nginx/sites-available/zieclip  (symlinked from sites-enabled/)
# After edits: sudo nginx -t && sudo systemctl reload nginx

# --- Global gzip + brotli compression (put at http {} level typically,
# but this works inside server{} for zieclip-specific responses too) ---

# --- Redirect all plain HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name clip.zieads.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clip.zieads.com;

    ssl_certificate     /etc/letsencrypt/live/clip.zieads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clip.zieads.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── PERFORMANCE OPTIMIZATIONS (Aug 2026) ───────────────────────────
    # Gzip compression for text-based responses (HTML/JS/CSS/JSON).
    # Reduces bytes on the wire by 60-80% for typical Next.js pages.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        font/woff;

    # Enable sendfile & TCP optimizations for faster asset serving.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Upload cap
    client_max_body_size 220m;
    client_body_timeout   360s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    360s;
    proxy_read_timeout    360s;

    # Buffer sizes tuned for Next.js SSR responses
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # ── STATIC ASSET CACHING ───────────────────────────────────────────
    # Fingerprinted /_next/static files can cache forever (Next hashes filenames)
    location /_next/static/ {
        alias /home/ubuntu/zieclip/current/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public assets (logo, favicon, fonts) — cache 30 days with revalidate
    location ~* ^/(logo|icon|apple-icon)\.png$ {
        root /home/ubuntu/zieclip/current/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        proxy_set_header Host $host;
    }

    # Next.js image optimizer — cache aggressively
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── DYNAMIC ROUTES ─────────────────────────────────────────────────
    # Everything else goes to Node.js (via PM2)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
