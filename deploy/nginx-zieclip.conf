# nginx reverse proxy for zieclip in production.
#
# Path: /etc/nginx/sites-available/zieclip  (symlinked from sites-enabled/)
# After edits: sudo nginx -t && sudo systemctl reload nginx

# --- Redirect all plain HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name clip.zieads.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clip.zieads.com;

    ssl_certificate     /etc/letsencrypt/live/clip.zieads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clip.zieads.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Gzip compression only (safe, big win) ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Upload cap must match MAX_UPLOAD_BYTES in /api/upload/route.ts
    client_max_body_size 220m;

    # Long timeouts for downloads / exports
    client_body_timeout   360s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    360s;
    proxy_read_timeout    360s;

    # Serve /_next/static directly through nginx (fingerprinted, immutable)
    location /_next/static/ {
        alias /home/ubuntu/zieclip/current/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Public logos/favicons — cache 30 days
    location ~* ^/(logo|icon|apple-icon)\.png$ {
        root /home/ubuntu/zieclip/current/public;
        expires 30d;
        access_log off;
    }

    # Everything else proxies to Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
